name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download dependencies
        run: go mod download
      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Check formatting (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = gofmt -l .
          if ($out) { Write-Host "gofmt needed on:"; Write-Host $out; exit 1 }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Smoke test the binary
        shell: bash
        run: |
          go build -o clip-patch-smoke ./cmd/clip-patch
          ./clip-patch-smoke --version
          ./clip-patch-smoke --help > /dev/null

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz the parser briefly
        run: go test ./internal/parser -run='^$' -fuzz=FuzzParse -fuzztime=20s
